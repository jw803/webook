# 範本檔，裡面全部是佔位值，不是真實密鑰。
# 正式環境請勿把填入真實值的版本 commit 進 git，改用下列任一方式產生：
#   kubectl create secret generic webook-secrets \
#     --from-literal=APP_DB='...' \
#     --from-literal=APP_REDIS='...' \
#     --from-literal=APP_SECRET_KEY='...' \
#     --from-literal=APP_ALLOWED_ORIGINS='...' \
#     --from-literal=JWT_REFRESH_TOKEN_KEY='...' \
#     --from-literal=WECHAT_STATE_KEY='...' \
#     --from-literal=WECHAT_APP_ID='...' \
#     --from-literal=WECHAT_APP_SECRET='...'
# 或用 sealed-secrets / external-secrets 之類的工具從密鑰管理服務（如 AWS Secrets Manager、Vault）同步進來。
apiVersion: v1
kind: Secret
metadata:
  name: webook-secrets
type: Opaque
stringData:
  APP_DB: "CHANGE_ME"
  APP_REDIS: "CHANGE_ME"
  APP_SECRET_KEY: "CHANGE_ME"
  APP_ALLOWED_ORIGINS: "CHANGE_ME"
  JWT_REFRESH_TOKEN_KEY: "CHANGE_ME"
  WECHAT_STATE_KEY: "CHANGE_ME"
  WECHAT_APP_ID: "CHANGE_ME"
  WECHAT_APP_SECRET: "CHANGE_ME"
