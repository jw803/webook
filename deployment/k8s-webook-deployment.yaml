apiVersion: apps/v1
kind: Deployment
metadata:
  name: webook-live
#  specification
spec:
#  副本数量
  replicas: 3
  selector:
    matchLabels:
      app: webook-live
#      template 描述的是你的 POD 是什么样的
  template:
    metadata:
      labels:
        app: webook-live
#    POD 的具体信息
    spec:
      containers:
        - name: webook
          image: flycash/webook-live:v0.0.1
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_ROLE
              value: "webapi"
          # 敏感設定（DB、Redis、JWT/OAuth 金鑰等）從 Secret 注入，
          # 範本見 k8s-webook-secret.yaml；正式環境請用 kubectl / 密鑰管理服務建立，勿把填好真實值的檔案 commit 進 git。
          envFrom:
            - secretRef:
                name: webook-secrets
